<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:800px;background:#000;color:#fff;font-family:Manrope,sans-serif;overflow:hidden;position:relative}
.art{position:absolute;inset:0;background:url('../public/img/hero.webp') center 58%/cover no-repeat}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,0) 78%,rgba(0,0,0,.45) 100%),linear-gradient(90deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 45%)}
.c{position:relative;z-index:1;height:100%;padding:72px 84px 64px;display:flex;flex-direction:column}
.l{font:500 22px/1 "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
h1{font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.045em;margin-top:28px;text-shadow:0 6px 40px rgba(0,0,0,.35)}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.logos{display:flex;align-items:flex-end;gap:28px}
.logos .sgn{height:120px}.logos .gen{height:78px}
.url{color:#ff7a48;margin-top:16px}
</style></head><body>
<div class="art"></div>
<div class="c">
  <p class="l">London · 13 October 2026</p>
  <h1>Fintech<br>Hackathon</h1>
  <div class="bottom">
    <div><p class="l">Start where money gets stuck. ↗</p><p class="l url">shiptonight.com</p></div>
    <div class="logos"><img class="sgn" src="../public/sgn-logo.svg" alt=""><img class="gen" src="../public/generate-logo.svg" alt=""></div>
  </div>
</div>
</body></html>
