<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <title>Organiser console — Fintech Hackathon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    .wrap{padding:34px 0 90px}
    .phases{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:22px 0 10px}
    .phase{border:1px solid var(--line-2);background:transparent;padding:14px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
    .phase b{font-size:16px;letter-spacing:-.03em}
    .phase small{color:var(--muted);font-size:12px;line-height:1.35}
    .phase.cur{border-color:var(--orange);background:rgba(255,90,31,.09)}
    .phase.past{opacity:.55}
    .phase:hover{border-color:var(--paper)}
    section.block{border-top:1px solid var(--line);padding:30px 0 10px;margin-top:30px}
    .block-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .block-head h2{font-size:28px;letter-spacing:-.05em;margin:0;font-weight:600}
    .row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .judges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .jbox.off{background:transparent;border-style:dashed}
    .jbox.off h3{color:var(--muted)}
    .jbox .slot-form{display:grid;gap:6px;margin-top:12px}
    .jbox .slot-form input{padding:9px 10px;font-size:14px}
    .jbox-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .jbox{border:1px solid var(--line);background:var(--panel);padding:16px}
    .jbox h3{margin:0 0 2px;font-size:17px;letter-spacing:-.03em}
    .jbox .link{display:flex;gap:6px;margin-top:12px}
    .jbox .link input{font:12px "DM Mono",monospace;padding:8px}
    .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
    .stat b{font-family:"DM Mono",monospace;font-weight:400}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{font:10px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
    td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    tr.withdrawn td{opacity:.4}
    td select{padding:7px 8px;font-size:13px;min-width:120px}
    .scroll{overflow-x:auto}
    .rank{font:600 20px Manrope;letter-spacing:-.04em}
    .winners{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .wbox{border:1px solid var(--line-2);padding:16px;background:var(--panel)}
    .wbox select{margin-top:10px}
    .counts{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
    .counts div{font:11px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .counts b{display:block;font:600 34px Manrope;letter-spacing:-.05em;color:var(--paper);text-transform:none}
    .chk{width:18px;height:18px;accent-color:var(--orange)}
    @media(max-width:900px){.phases{grid-template-columns:1fr 1fr}.judges,.winners{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.judges,.winners{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar"><a class="wordmark" href="/">Fintech<br>Hackathon</a><nav><a href="/results" target="_blank">Results screen ↗</a><a href="#" id="signout">Sign out</a></nav></header>
  <main class="container wrap" id="app"><p class="muted">Loading…</p></main>
  <script src="/assets/app.js"></script>
  <script>
  (() => {
    const { esc, safeUrl, api, toast, store } = FH;
    const app = document.getElementById('app');
    const KEY = 'fh-admin-key';
    let key = store.get(KEY);
    let S = null;
    const H = () => ({ 'x-admin-key': key });
    const PHASE_INFO = {
      submissions: ['Submissions open', 'Teams submit. Judges can start round 1 as projects arrive.'],
      review: ['Round 1 · Review', 'Submissions close. Judges score their share and pick 1 per track.'],
      shortlist: ['Round 2 · Shortlist', 'All judges score every top pick. Top 6 present.'],
      finals: ['Finals', 'Finalists present live. Judges score them.'],
      results: ['Results', 'Winners shown on /results.'],
    };
    const fmt = n => n == null ? '—' : n;
    const sub = id => S.submissions.find(s => s.id === id);
    const tname = id => S.tracks.find(t => t.id === id)?.name || id;
    const jname = id => S.judges.find(j => j.id === id)?.name || '—';

    function login(msg) {
      app.innerHTML = `<div style="max-width:440px;padding:60px 0"><p class="eyebrow orange">Organisers</p><h1 class="page-title">Console<br><em>sign in.</em></h1>
        <form id="f" style="display:flex;gap:8px;margin-top:28px"><input type="password" name="k" placeholder="Admin key" aria-label="Admin key" required><button class="button">Enter</button></form>${msg ? `<p class="error-text">${esc(msg)}</p>` : ''}</div>`;
      document.getElementById('f').onsubmit = e => { e.preventDefault(); key = new FormData(e.target).get('k'); store.set(KEY, key); load(); };
    }
    document.getElementById('signout').onclick = e => { e.preventDefault(); store.set(KEY, null); key = null; login(); };

    async function call(path, body, method = 'POST') {
      try { S = await api(path, { method, body, headers: H() }); render(); return true; }
      catch (err) { toast(err.message, true); return false; }
    }
    async function load() {
      if (!key) return login();
      try { S = await api('/api/admin/state', { headers: H() }); render(); }
      catch (err) { if (err.status === 401) { store.set(KEY, null); key = null; login(err.message); } else toast(err.message, true); }
    }
    const typing = () => document.activeElement?.matches('select,input:not([readonly])') || [...document.querySelectorAll('[data-slot] input')].some(i => i.value && !i.defaultValue);
    setInterval(() => { if (key && S && !document.hidden && !typing()) load(); }, 10000);

    function render() {
      // Keep anything half-typed in the add-judge forms across re-renders.
      const drafts = Object.fromEntries([...document.querySelectorAll('[data-slot]')].map(f => [f.dataset.slot, { name: f.querySelector('[name=name]').value, org: f.querySelector('[name=org]').value }]));
      renderPage();
      for (const [id, d] of Object.entries(drafts)) { const f = document.querySelector(`[data-slot="${id}"]`); if (f) { const n = f.querySelector('[name=name]'), o = f.querySelector('[name=org]'); n.value ||= d.name; o.value ||= d.org; } }
    }
    function renderPage() {
      const live = S.submissions.filter(s => !s.withdrawn);
      const pi = S.phases.indexOf(S.phase);
      app.innerHTML = `
        <p class="eyebrow orange">Organiser console</p>
        <h1 class="page-title" style="font-size:clamp(40px,5vw,64px)">Run the <em>judging.</em></h1>
        <div class="counts">
          <div><b>${live.length}</b>Submissions</div>
          ${S.tracks.map(t => `<div><b>${live.filter(s => s.track === t.id).length}</b>${esc(t.name)}</div>`).join('')}
          <div><b>${live.filter(s => s.round1?.total != null).length}</b>Reviewed in round 1</div>
        </div>

        <section class="block">
          <div class="block-head"><h2>Phase</h2>
            <div class="row-actions"><span class="pill ${S.submissionsOpen ? 'green' : 'red'}">Submissions ${S.submissionsOpen ? 'open' : 'closed'}</span>
            <button class="button small ghost" id="toggleSubs">${S.submissionsOpen ? 'Close submissions' : 'Reopen submissions'}</button></div>
          </div>
          <div class="phases">${S.phases.map((p, i) => `<button class="phase ${p === S.phase ? 'cur' : i < pi ? 'past' : ''}" data-phase="${p}"><span class="mono" style="color:var(--orange)">0${i + 1}${p === S.phase ? ' · now' : ''}</span><b>${PHASE_INFO[p][0]}</b><small>${PHASE_INFO[p][1]}</small></button>`).join('')}</div>
          <p class="muted small">Moving past "Submissions open" closes submissions. Judges' screens update within 20 seconds.</p>
        </section>

        <section class="block">
          <div class="block-head"><h2>Judges</h2><span class="muted small">Send each judge their own link. Add or remove judges any time: unscored entries are re-split automatically.</span></div>
          <div class="judges">${S.judges.map(j => {
            if (!j.active && j.optional) return `<div class="jbox off"><p class="eyebrow" style="margin:0 0 4px">Optional slot</p><h3>Add a judge</h3>
              <span class="muted small">Entries that haven't been scored are re-split to include them.</span>
              <form class="slot-form" data-slot="${j.id}"><input name="name" placeholder="Name" value="${j.name.startsWith('Guest judge') ? '' : esc(j.name)}" required aria-label="Judge name"><input name="org" placeholder="Organisation (optional)" value="${esc(j.org)}" aria-label="Organisation"><button class="button small">Add judge</button></form></div>`;
            const link = `${location.origin}/judge?k=${j.code}`;
            const picks = S.tracks.map(t => j.picks[t.id] ? (j.picks[t.id].auto ? '☆' : '★') : '·').join(' ');
            return `<div class="jbox ${j.active ? '' : 'off'}"><div class="jbox-head"><div><h3>${esc(j.name)}</h3><span class="muted small">${esc(j.org)}${j.active ? '' : ' · not judging'}</span></div>
              <button class="text-link" data-active="${j.id}" data-val="${j.active ? 0 : 1}">${j.active ? (j.optional ? 'Remove' : 'Mark absent') : 'Bring back'}</button></div>
              <div style="margin-top:12px">
                <div class="stat"><span>Round 1 scored</span><b>${j.reviewed} / ${j.assigned}</b></div>
                <div class="stat"><span title="★ chosen · ☆ automatic (best score, judge hasn't chosen)">Top picks ★ / ☆ auto</span><b>${picks}</b></div>
                <div class="stat"><span>Shortlist scored</span><b>${j.shortlistScored} / ${S.pool.length}</b></div>
                <div class="stat"><span>Finals scored</span><b>${j.finalsScored} / ${S.finalists.length}</b></div>
              </div>
              ${j.active ? `<div class="link"><input readonly value="${esc(link)}" aria-label="Judge link for ${esc(j.name)}"><button class="button small" data-copy="${esc(link)}">Copy</button></div>` : ''}</div>`;
          }).join('')}</div>
        </section>

        <section class="block">
          <div class="block-head"><h2>Sponsor prizes</h2><span class="muted small">Separate from the main judging. Zaro: entries that ticked the Zaro box. Foldo: entries with a Foldo link or video.</span></div>
          <div class="judges">${(S.sponsors || []).map(sp => {
            const link = `${location.origin}/judge?k=${sp.code}`;
            const pick = sp.entries.find(e => e.id === sp.pick);
            return `<div class="jbox"><div class="jbox-head"><div><h3>${esc(sp.judge)}</h3><span class="muted small">${esc(sp.name)}</span></div></div>
              <div style="margin-top:12px">
                <div class="stat"><span>Entries</span><b>${sp.entries.length}</b></div>
                <div class="stat"><span>Scored</span><b>${sp.entries.filter(e => e.score != null).length} / ${sp.entries.length}</b></div>
                <div class="stat"><span>Winner pick</span><b>${pick ? esc(pick.title) : '—'}</b></div>
              </div>
              <div class="link"><input readonly value="${esc(link)}" aria-label="Judge link for ${esc(sp.judge)}"><button class="button small" data-copy="${esc(link)}">Copy</button></div></div>`;
          }).join('')}</div>
        </section>

        <section class="block">
          <div class="block-head"><h2>Submissions</h2>
            <div class="row-actions"><button class="button small ghost" id="rebalance">Even out unscored entries</button><a class="button small ghost" href="#" id="csv">Export CSV</a></div></div>
          <div class="scroll"><table><thead><tr><th>#</th><th>Project</th><th>Track</th><th>Judge</th><th>R1</th><th>Video</th><th></th></tr></thead><tbody>
          ${S.submissions.map(s => `<tr class="${s.withdrawn ? 'withdrawn' : ''}"><td class="mono muted">${s.id}</td>
            <td><b>${esc(s.title)}</b><br><span class="muted small">${esc(s.teamName || s.members.map(m => m.name).join(', '))} · ${esc(s.contactEmail || '')}</span></td>
            <td><select data-track="${s.id}" aria-label="Track">${S.tracks.map(t => `<option value="${t.id}" ${t.id === s.track ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></td>
            <td><select data-judge="${s.id}" aria-label="Judge"><option value="">Unassigned</option>${S.judges.filter(j => j.active || j.id === s.judgeId).map(j => `<option value="${j.id}" ${j.id === s.judgeId ? 'selected' : ''}>${esc(j.name)}${j.active ? '' : ' (absent)'}</option>`).join('')}</select></td>
            <td><b>${fmt(s.round1?.total)}</b>${s.round1?.verdict ? ` <span class="pill ${s.round1.verdict === 'yes' ? 'green' : 'red'}">${s.round1.verdict === 'yes' ? '✓' : '✕'}</span>` : ''}</td>
            <td>${safeUrl(s.videoUrl) ? `<a class="text-link" href="${esc(safeUrl(s.videoUrl))}" target="_blank" rel="noopener">Watch ↗</a>` : '—'}</td>
            <td><button class="text-link" data-withdraw="${s.id}" data-val="${s.withdrawn ? 0 : 1}">${s.withdrawn ? 'Restore' : 'Withdraw'}</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No submissions yet.</td></tr>'}
          </tbody></table></div>
        </section>

        <section class="block">
          <div class="block-head"><h2>Round 2 · Shortlist</h2><span class="muted small">Every judge's picks. Average of all judges' round 2 scores.</span></div>
          <div class="scroll"><table><thead><tr><th>Rank</th><th>Project</th><th>Track</th><th>Avg</th><th>Judges</th><th>✓</th><th>Finalist</th></tr></thead><tbody>
          ${S.pool.map((p, i) => { const s = sub(p.id); return `<tr><td class="rank">${i + 1}</td><td><b>${esc(s?.title)}</b></td><td>${esc(tname(s?.track))}</td><td><b>${fmt(p.avg)}</b></td><td class="mono">${p.count} / ${S.activeJudgeCount}</td><td class="mono">${p.yes}</td>
            <td><input type="checkbox" class="chk" data-fin="${p.id}" ${S.finalists.includes(p.id) ? 'checked' : ''} aria-label="Finalist"></td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">Appears once judges choose their top picks.</td></tr>'}
          </tbody></table></div>
          <div class="row-actions" style="margin-top:14px">
            <span class="pill ${S.finalistsLocked ? 'orange' : ''}">${S.finalists.length} finalists · ${S.finalistsLocked ? 'set by hand' : 'automatic: top 6, at least 1 per track'}</span>
            ${S.finalistsLocked ? '<button class="button small ghost" id="autoFin">Back to automatic</button>' : '<button class="button small ghost" id="lockFin">Lock current top 6</button>'}
          </div>
        </section>

        <section class="block">
          <div class="block-head"><h2>Finals & winners</h2><span class="muted small">Overall winner = best finals score. Track winners = best in track (not the overall winner, where possible).</span></div>
          <div class="scroll"><table><thead><tr><th>Rank</th><th>Finalist</th><th>Track</th><th>Avg</th><th>Judges</th></tr></thead><tbody>
          ${S.finals.map((p, i) => { const s = sub(p.id); return `<tr><td class="rank">${i + 1}</td><td><b>${esc(s?.title)}</b></td><td>${esc(tname(s?.track))}</td><td><b>${fmt(p.avg)}</b></td><td class="mono">${p.count} / ${S.activeJudgeCount}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No finalists yet.</td></tr>'}
          </tbody></table></div>
          <div class="winners" style="margin-top:18px">${[['overall', 'Overall winner'], ...S.tracks.map(t => [t.id, t.name])].map(([k, label]) => `
            <div class="wbox"><p class="eyebrow orange" style="margin:0 0 6px">${esc(label)}</p><b>${esc(sub(S.winners[k])?.title || 'Not decided')}</b>
            <select data-win="${k}" aria-label="${esc(label)}"><option value="">—</option>${S.finalists.map(id => `<option value="${id}" ${S.winners[k] === id ? 'selected' : ''}>${esc(sub(id)?.title)}</option>`).join('')}</select></div>`).join('')}</div>
          <div class="row-actions" style="margin-top:14px"><span class="pill ${S.winnersLocked ? 'orange' : ''}">${S.winnersLocked ? 'Winners set by hand' : 'Winners follow the scores'}</span>${S.winnersLocked ? '<button class="button small ghost" id="autoWin">Back to automatic</button>' : ''}
          <a class="button small" href="/results" target="_blank">Preview results screen ↗</a></div>
        </section>`;
      bind();
    }

    function bind() {
      document.querySelectorAll('[data-phase]').forEach(b => b.onclick = () => {
        if (b.dataset.phase === S.phase) return;
        if (confirm(`Move to "${PHASE_INFO[b.dataset.phase][0]}"? Judges' screens will switch.`)) call('/api/admin/phase', { phase: b.dataset.phase });
      });
      document.getElementById('toggleSubs').onclick = () => call('/api/admin/submissions-open', { open: !S.submissionsOpen });
      document.getElementById('rebalance').onclick = () => { call('/api/admin/rebalance', {}); };
      document.getElementById('csv').onclick = async e => {
        e.preventDefault();
        const res = await fetch('/api/admin/export.csv', { headers: H() });
        if (!res.ok) return toast('Export failed. Check the admin key and try again.', true);
        const url = URL.createObjectURL(await res.blob());
        Object.assign(document.createElement('a'), { href: url, download: 'fintech-hackathon-results.csv' }).click();
      };
      document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Link copied'); } catch { b.previousElementSibling.select(); } });
      document.querySelectorAll('[data-slot]').forEach(f => f.onsubmit = e => {
        e.preventDefault(); const fd = new FormData(f);
        call(`/api/admin/judges/${f.dataset.slot}`, { name: fd.get('name'), org: fd.get('org'), active: true }, 'PATCH').then(ok => ok && toast('Judge added. Copy their link below.'));
      });
      document.querySelectorAll('[data-active]').forEach(b => b.onclick = () => {
        const j = S.judges.find(x => x.id === b.dataset.active); const on = b.dataset.val === '1';
        if (!on && !confirm(`Take ${j.name} off the panel? Their unscored entries move to the other judges. Scores they've already given are kept.`)) return;
        call(`/api/admin/judges/${j.id}`, { active: on }, 'PATCH');
      });
      document.querySelectorAll('[data-judge]').forEach(s => s.onchange = () => call(`/api/admin/submissions/${s.dataset.judge}`, { judgeId: s.value || null }, 'PATCH'));
      document.querySelectorAll('[data-track]').forEach(s => s.onchange = () => call(`/api/admin/submissions/${s.dataset.track}`, { track: s.value }, 'PATCH'));
      document.querySelectorAll('[data-withdraw]').forEach(b => b.onclick = () => call(`/api/admin/submissions/${b.dataset.withdraw}`, { withdrawn: b.dataset.val === '1' }, 'PATCH'));
      document.querySelectorAll('[data-fin]').forEach(c => c.onchange = () => {
        const ids = new Set(S.finalists); c.checked ? ids.add(Number(c.dataset.fin)) : ids.delete(Number(c.dataset.fin));
        call('/api/admin/finalists', { ids: [...ids] });
      });
      document.getElementById('lockFin')?.addEventListener('click', () => call('/api/admin/finalists', { ids: S.finalists }));
      document.getElementById('autoFin')?.addEventListener('click', () => call('/api/admin/finalists', { ids: null }));
      document.getElementById('autoWin')?.addEventListener('click', () => call('/api/admin/winners', { winners: null }));
      document.querySelectorAll('[data-win]').forEach(s => s.onchange = () => {
        const w = { ...S.winners, [s.dataset.win]: s.value ? Number(s.value) : null };
        call('/api/admin/winners', { winners: w });
      });
    }
    load();
  })();
  </script>
</body>
</html>
