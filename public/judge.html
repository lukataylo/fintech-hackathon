<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <title>Judging — Fintech Hackathon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    .login{min-height:calc(100svh - 76px);display:grid;place-items:center;padding:40px 0}
    .login-box{width:min(460px,100%)}
    .login-box form{display:flex;gap:8px;margin-top:30px}
    .login-box input{font-family:"DM Mono",monospace;letter-spacing:.12em}

    .judge-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:34px 0 22px;flex-wrap:wrap}
    .judge-head h1{font-size:clamp(34px,4.6vw,58px);line-height:.95;letter-spacing:-.07em;margin:0;font-weight:600}
    .judge-head h1 em{font-style:normal;color:var(--orange)}
    .tabs{display:flex;gap:4px;border:1px solid var(--line);padding:4px}
    .tabs button{border:0;background:transparent;padding:10px 14px;font:11px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer}
    .tabs button[aria-selected=true]{background:var(--paper);color:#111}
    .progress{display:flex;align-items:center;gap:14px;margin:0 0 16px}
    .bar{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
    .bar i{position:absolute;inset:0 auto 0 0;background:var(--orange);transition:width .4s}
    .strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:thin}
    .strip button{flex:0 0 auto;border:1px solid var(--line-2);background:transparent;cursor:pointer;min-width:38px;height:34px;padding:0 9px;font:11px "DM Mono",monospace;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
    .strip button.cur{border-color:var(--paper);color:var(--paper)}
    .strip button.yes{border-color:var(--green);color:var(--green)}
    .strip button.no{color:#6d6964;border-color:rgba(255,255,255,.12);text-decoration:line-through}
    .strip button.rated:not(.yes):not(.no){color:var(--paper)}

    .stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);gap:20px;align-items:start;padding-bottom:60px}
    .deck{position:relative}
    .deck:before,.deck:after{content:"";position:absolute;left:14px;right:14px;height:100%;top:0;border:1px solid var(--line);background:#0d0d0d;z-index:0;transform:translateY(10px) scale(.975)}
    .deck:after{transform:translateY(20px) scale(.95);opacity:.5}
    .deck.single:before,.deck.single:after{display:none}
    .jcard{position:relative;z-index:1;background:var(--panel);border:1px solid var(--line-2);touch-action:pan-y;user-select:none;will-change:transform}
    .jcard.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1)}
    @keyframes enter{from{transform:translateY(14px) scale(.97);opacity:.4}}
    .jcard.shake{animation:shake .38s}
    @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
    .grab{padding:22px 24px 18px;cursor:grab;display:grid;grid-template-columns:1fr auto;gap:16px}
    .grab:active{cursor:grabbing}
    .grab h2{font-size:clamp(26px,3vw,38px);letter-spacing:-.06em;line-height:1;margin:10px 0 8px;font-weight:600}
    .grab p{margin:0;color:#cfc9c2;font-size:15px}
    .meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .media{position:relative;aspect-ratio:16/9;background:#000;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .media .fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
    .details{padding:20px 24px 24px;display:grid;gap:18px}
    .desc{white-space:pre-wrap;color:#d6d0c9;font-size:15px;line-height:1.65;margin:0;max-height:9.9em;overflow:hidden;position:relative}
    .desc.open{max-height:none}
    .members{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
    .members a{color:var(--paper);text-decoration:none;border-bottom:1px solid #6d6964}
    .members a:hover{color:var(--orange);border-color:var(--orange)}
    .stamp{position:absolute;top:26px;z-index:3;padding:8px 14px;font:600 20px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.1em;border:3px solid;opacity:0;pointer-events:none}
    .stamp.yes{left:22px;color:var(--green);transform:rotate(-12deg)}
    .stamp.no{right:22px;color:var(--red);transform:rotate(12deg)}
    .clock{font:12px "DM Mono",monospace;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);padding:6px 10px;background:transparent;cursor:pointer;color:var(--paper);white-space:nowrap}
    .clock.over{border-color:var(--orange);color:var(--orange)}
    .clock.run:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);animation:blink 1s infinite}
    @keyframes blink{50%{opacity:.2}}

    .scorer{position:sticky;top:92px;border:1px solid var(--line-2);background:var(--panel)}
    .scorer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
    .total{font:600 34px Manrope;letter-spacing:-.06em}
    .total small{font:11px "DM Mono",monospace;color:var(--muted);letter-spacing:.06em;margin-left:4px}
    .crit{padding:14px 20px;border-bottom:1px solid var(--line);transition:background .2s}
    .crit.active{background:rgba(255,90,31,.06);box-shadow:inset 2px 0 var(--orange)}
    .crit-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .crit h3{font-size:15px;margin:0;letter-spacing:-.02em}
    .crit .w{font:11px "DM Mono",monospace;color:var(--orange)}
    .crit p{margin:3px 0 10px;font-size:12.5px;color:var(--muted);line-height:1.4}
    .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    .dots button{height:40px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font:13px "DM Mono",monospace;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
    .dots button:hover{border-color:var(--paper);color:var(--paper)}
    .dots button.on{background:var(--orange);border-color:var(--orange);color:#111}
    .dots button.fill{background:rgba(255,90,31,.22);border-color:rgba(255,90,31,.5);color:var(--paper)}
    .scale-legend{display:flex;justify-content:space-between;font:10px "DM Mono",monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
    .note{padding:14px 20px;border-bottom:1px solid var(--line)}
    .note textarea{min-height:64px;font-size:14px;padding:10px 12px}
    .swipe-bar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:16px 20px;align-items:center}
    .swipe{height:58px;border:1px solid;background:transparent;cursor:pointer;font:11px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,color .2s,transform .15s}
    .swipe:active{transform:scale(.97)}
    .swipe b{font-size:20px;font-weight:400}
    .swipe.no{color:var(--red);border-color:rgba(255,107,91,.55)}.swipe.no:hover,.swipe.no.sel{background:var(--red);color:#111}
    .swipe.yes{color:var(--green);border-color:rgba(127,209,139,.55)}.swipe.yes:hover,.swipe.yes.sel{background:var(--green);color:#111}
    .skip{border:0;background:none;color:var(--muted);font:10px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:8px}
    .skip:hover{color:var(--paper)}
    .keys{padding:0 20px 16px;font:10px "DM Mono",monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;line-height:1.7}
    kbd{font:inherit;border:1px solid var(--line-2);padding:1px 5px;color:var(--muted)}
    .context{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;color:#cfc9c2;display:grid;gap:4px}

    .empty{padding:70px 0 100px;max-width:680px}
    .empty h2{font-size:clamp(34px,4.5vw,56px);line-height:.98;letter-spacing:-.07em;margin:0 0 18px;font-weight:600}
    .empty h2 em{font-style:normal;color:var(--orange)}
    .empty .button{margin-top:26px}

    .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:70px}
    .pick-col{border-top:1px solid var(--line-2);padding-top:16px}
    .pick-col h3{font-size:22px;letter-spacing:-.04em;margin:6px 0 14px}
    .pick{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s}
    .pick:hover{border-color:var(--paper)}
    .pick.sel{border-color:var(--orange);background:rgba(255,90,31,.09)}
    .pick b{display:block;font-size:16px;letter-spacing:-.02em}
    .pick small{color:var(--muted);font-size:12.5px}
    .pick .score{font:600 22px Manrope;letter-spacing:-.05em;text-align:right}
    .pick .score small{display:block;font:10px "DM Mono",monospace;text-transform:uppercase}
    .pick-done{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border:1px solid var(--line);padding:18px 20px;margin:4px 0 26px}

    .listview{width:100%;border-collapse:collapse;margin-bottom:70px;font-size:14px}
    .listview th{font:10px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2)}
    .listview td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    .listview tr{cursor:pointer}.listview tbody tr:hover{background:#101010}

    @media(max-width:900px){
      .stage{grid-template-columns:1fr;gap:14px;padding-bottom:120px}
      .scorer{position:static}
      .swipe-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(8,8,8,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line-2);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
      .keys{display:none}
      .picks{grid-template-columns:1fr}
      .grab{padding:18px 18px 14px}.details{padding:16px 18px 20px}
      .judge-head{padding:24px 0 16px}
      .listview .hide-sm{display:none}
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar"><a class="wordmark" href="/">Fintech<br>Hackathon</a><nav aria-label="Judge"><span class="who mono" id="who"></span><a href="#" id="signout" class="hidden">Sign out</a></nav></header>
  <main class="container" id="app"><p class="muted" style="padding:80px 0">Loading…</p></main>

  <script src="/assets/app.js"></script>
  <script>
  (() => {
    const { esc, safeUrl, api, toast, embedUrl, store } = FH;
    const app = document.getElementById('app');
    const KEY = 'fh-judge-key';
    const DEMO_LIMIT = 90;

    // Sign-in via ?k=CODE link, saved locally so judges don't need it again.
    const qs = new URLSearchParams(location.search);
    if (qs.get('k')) { store.set(KEY, qs.get('k').trim().toLowerCase()); history.replaceState(null, '', '/judge'); }
    let key = store.get(KEY);

    let S = null;            // server state
    let view = null;         // 'review' | 'picks' | 'list' | 'shortlist' | 'finals'
    let idx = 0;             // current card in the active list
    let draft = null;        // working scores for the current card
    let curId = null;        // id of the card on screen
    let busy = false;        // a swipe is being saved/animated
    let clock = { start: 0, elapsed: 0, timer: null };

    const ROUND = { review: 1, shortlist: 2, finals: 3 };
    const VERDICT = {
      1: { yes: 'Contender', no: 'Pass' },
      2: { yes: 'Finalist', no: 'Not this time' },
      3: { yes: 'Winner material', no: 'Not quite' },
    };
    const trackName = id => S.tracks.find(t => t.id === id)?.name || id;
    const judgeH = h => ({ 'x-judge-key': key });
    const total = s => S.criteria.every(c => s?.[c.id]) ? Math.round(S.criteria.reduce((a, c) => a + s[c.id] / 5 * c.weight, 0) * 10) / 10 : null;
    const fmt = n => n == null ? '—' : (Number.isInteger(n) ? n : n.toFixed(1));

    // ---------- sign in ----------
    function loginView(msg) {
      document.getElementById('who').textContent = '';
      document.getElementById('signout').classList.add('hidden');
      app.innerHTML = `<div class="login"><div class="login-box">
        <p class="eyebrow orange">Judges only</p>
        <h1 class="page-title">Judge<br><em>sign in.</em></h1>
        <p class="lede">Enter the code from your judging link.</p>
        <form id="login"><input type="text" name="code" placeholder="Judge code" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Judge code" required><button class="button">Enter</button></form>
        ${msg ? `<p class="error-text">${esc(msg)}</p>` : ''}
      </div></div>`;
      document.getElementById('login').onsubmit = e => {
        e.preventDefault(); key = new FormData(e.target).get('code').trim().toLowerCase(); store.set(KEY, key); load(true);
      };
    }
    document.getElementById('signout').onclick = e => { e.preventDefault(); store.set(KEY, null); key = null; S = null; loginView(); };

    async function load(first = false) {
      if (!key) return loginView();
      try {
        const next = await api('/api/judge/state', { headers: judgeH() });
        const phaseChanged = S && S.phase !== next.phase;
        S = next;
        document.getElementById('who').textContent = S.judge.name;
        document.getElementById('signout').classList.remove('hidden');
        if (first || phaseChanged || !view) { view = defaultView(); idx = firstOpen(); render(); if (phaseChanged) toast(`New round: ${roundTitle()}`); }
        return true;
      } catch (err) {
        if (err.status === 401) { store.set(KEY, null); key = null; loginView(err.message); }
        else if (first) app.innerHTML = `<p style="padding:80px 0">${esc(err.message)}</p>`;
        return false;
      }
    }
    // Poll for phase changes and list changes. The open card is tracked by id, never by position, and the
    // judge's unsaved scores are never touched.
    setInterval(async () => {
      if (!S || document.hidden) return;
      const prevIds = list().map(s => s.id).join();
      const prevPhase = S.phase;
      try {
        const next = await api('/api/judge/state', { headers: judgeH() });
        if (next.phase !== prevPhase) { await flushSave(); S = next; view = defaultView(); idx = firstOpen(); render(); toast(`New round: ${roundTitle()}`); return; }
        S = next;
        const l = list();
        if (l.map(s => s.id).join() === prevIds) { if (curId != null) idx = Math.max(0, l.findIndex(x => x.id === curId)); return; }
        if (curId != null && document.getElementById('card')) {
          const ni = l.findIndex(x => x.id === curId);
          if (ni >= 0) { idx = ni; renderChrome(); toast('Your project list was updated'); }
          else { await flushSave(); idx = firstOpen(); renderChrome(); renderCard(); toast('That project was moved to another judge'); }
        } else render();
      } catch (err) {
        if (err.status === 401) { store.set(KEY, null); key = null; S = null; loginView('Your judge access has been switched off. Ask an organiser if this is a mistake.'); }
      }
    }, 20000);

    function defaultView() {
      return { submissions: 'review', review: 'review', shortlist: 'shortlist', finals: 'finals', results: 'results' }[S.phase];
    }
    function list() {
      if (view === 'review' || view === 'picks' || view === 'list') return S.review;
      if (view === 'shortlist') return S.shortlist || [];
      if (view === 'finals') return S.finals || [];
      return [];
    }
    const round = () => ROUND[view] || 1;
    const isDone = s => !!s.score?.verdict && total(s.score) != null;
    function firstOpen() { const l = list(); const i = l.findIndex(s => !isDone(s)); return i < 0 ? l.length : i; }
    function roundTitle() {
      return { submissions: 'Round 1 · Your projects', review: 'Round 1 · Your projects', shortlist: 'Round 2 · Shortlist', finals: 'Final · Live presentations', results: 'Results' }[S.phase];
    }

    // ---------- layout ----------
    function render() {
      stopClock();
      if (view === 'results') {
        app.innerHTML = `<div class="empty"><p class="eyebrow orange">Judging closed</p><h2>Thank you for<br><em>judging.</em></h2><p class="lede">The winners have been announced.</p><a class="button" href="/results">See the results ↗</a></div>`;
        return;
      }
      app.innerHTML = `<div id="chrome"></div><div id="view"></div>`;
      renderChrome();
      if (view === 'picks') return renderPicks();
      if (view === 'list') return renderList();
      renderCard();
    }

    function renderChrome() {
      const l = list(); const done = l.filter(isDone).length;
      const r1 = S.phase === 'submissions' || S.phase === 'review';
      const tabs = r1 ? [['review', 'Swipe'], ['list', `List (${l.length})`], ['picks', 'Top 3 picks']] : [[view, 'Swipe']];
      const sub = {
        review: `Watch each demo (1:30 max), score all four criteria, then swipe. Afterwards choose your top project in each track.`,
        list: 'Every project assigned to you. Click one to open it.',
        picks: 'Choose one project per track. These go to the whole panel in round 2.',
        shortlist: `Every judge's top picks. Score them all. The top ${S.finalistCount} present live.`,
        finals: 'Score each team as they present. One winner per track plus an overall winner.',
      }[view];
      document.getElementById('chrome').innerHTML = `
        <div class="judge-head">
          <div><p class="eyebrow orange" style="margin-bottom:12px">${esc(roundTitle())}</p>
          <h1>${view === 'picks' ? 'Your <em>top 3.</em>' : view === 'shortlist' ? 'The <em>shortlist.</em>' : view === 'finals' ? 'The <em>finals.</em>' : 'Your <em>projects.</em>'}</h1>
          <p class="muted small" style="margin:10px 0 0;max-width:620px">${sub}</p></div>
          ${tabs.length > 1 ? `<div class="tabs" role="tablist">${tabs.map(([v, label]) => `<button role="tab" aria-selected="${v === view}" data-view="${v}">${label}</button>`).join('')}</div>` : ''}
        </div>
        ${view === 'picks' ? '' : `
        <div class="progress"><span class="mono muted">${done} / ${l.length} scored</span><div class="bar"><i style="width:${l.length ? done / l.length * 100 : 0}%"></i></div></div>
        ${view !== 'list' && l.length ? `<div class="strip" aria-label="Projects">${l.map((s, i) => `<button data-i="${i}" class="${i === idx ? 'cur ' : ''}${s.score?.verdict || ''} ${total(s.score) != null ? 'rated' : ''}" title="${esc(s.title)}">${String(i + 1).padStart(2, '0')}${total(s.score) != null ? `<span>${fmt(total(s.score))}</span>` : ''}</button>`).join('')}</div>` : ''}`}`;
      document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; idx = firstOpen(); render(); });
      document.querySelectorAll('.strip [data-i]').forEach(b => b.onclick = () => { flushSave(); idx = Number(b.dataset.i); renderCard(); renderChrome(); });
      document.querySelector('.strip .cur')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    // ---------- card ----------
    function renderCard() {
      stopClock();
      const l = list(); const el = document.getElementById('view');
      if (!l.length) {
        el.innerHTML = view === 'review'
          ? `<div class="empty"><h2>No projects <em>yet.</em></h2><p class="lede">Projects appear here as teams submit. This page checks for new ones every 20 seconds.</p></div>`
          : `<div class="empty"><h2>Waiting for the <em>shortlist.</em></h2><p class="lede">Nothing to score yet. This page updates automatically.</p></div>`;
        return;
      }
      if (idx >= l.length) { curId = null; return renderAllDone(); }
      const s = l[idx]; curId = s.id; busy = false;
      draft = { ...Object.fromEntries(S.criteria.map(c => [c.id, s.score?.[c.id] || null])), verdict: s.score?.verdict || null, note: s.score?.note || '' };
      const embed = embedUrl(s.videoUrl);
      const v = VERDICT[round()];
      const context = view === 'shortlist'
        ? `<div class="context"><span class="mono muted">Picked by</span><span>${s.pickedBy.map(esc).join(', ')}${s.round1?.total != null ? ` · your round 1 score: <b>${fmt(s.round1.total)}</b>` : ''}</span></div>` : '';
      el.innerHTML = `
      <div class="stage">
        <div class="deck ${idx >= l.length - 1 ? 'single' : ''}">
          <article class="jcard enter" id="card" aria-label="${esc(s.title)}">
            <div class="stamp yes">${v.yes}</div><div class="stamp no">${v.no}</div>
            <div class="grab">
              <div>
                <div class="meta-row"><span class="pill orange">${esc(trackName(s.track))}</span><span class="mono muted">${idx + 1} of ${l.length}</span></div>
                <h2>${esc(s.title)}</h2>
                <p>${esc(s.tagline)}</p>
              </div>
              <div><button class="clock" id="clock" title="Demo clock. Starts when you click the video.">0:00 / 1:30</button></div>
            </div>
            <div class="media">
              ${embed ? `<iframe id="player" src="${esc(embed)}" title="Demo video for ${esc(s.title)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen loading="lazy"></iframe>`
                : `<div class="fallback"><div><p class="muted">This video can't be embedded.</p>${safeUrl(s.videoUrl) ? `<a class="button" href="${esc(safeUrl(s.videoUrl))}" target="_blank" rel="noopener">Open demo video ↗</a>` : '<p>No video link was submitted.</p>'}</div></div>`}
            </div>
            <div class="details">
              <div><p class="desc" id="desc">${esc(s.description)}</p>${s.description.length > 420 ? '<button class="text-link" id="more" style="margin-top:10px">Read more</button>' : ''}</div>
              <div><p class="eyebrow" style="margin-bottom:8px">${esc(s.teamName || 'Team')}</p><div class="members">${s.members.map(m => safeUrl(m.linkedin) ? `<a href="${esc(safeUrl(m.linkedin))}" target="_blank" rel="noopener">${esc(m.name)} ↗</a>` : `<span>${esc(m.name)}</span>`).join('')}</div></div>
              <div class="meta-row">${safeUrl(s.videoUrl) ? `<a class="text-link" href="${esc(safeUrl(s.videoUrl))}" target="_blank" rel="noopener">Video in new tab ↗</a>` : ''}${safeUrl(s.demoUrl) ? `<a class="text-link" href="${esc(safeUrl(s.demoUrl))}" target="_blank" rel="noopener">Live demo / code ↗</a>` : ''}${safeUrl(s.foldoUrl) ? `<a class="text-link" href="${esc(safeUrl(s.foldoUrl))}" target="_blank" rel="noopener">Foldo ↗</a>` : ''}</div>
            </div>
          </article>
        </div>
        <aside class="scorer" aria-label="Score this project">
          <div class="scorer-head"><span class="eyebrow" style="margin:0">Weighted score</span><span class="total" id="total">—<small>/ 100</small></span></div>
          ${context}
          ${S.criteria.map((c, ci) => `
            <div class="crit" data-c="${c.id}">
              <div class="crit-top"><h3>${esc(c.name)}</h3><span class="w">${c.weight}%</span></div>
              <p>${esc(c.hint)}</p>
              <div class="dots" role="radiogroup" aria-label="${esc(c.name)}">${[1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" data-n="${n}" aria-label="${n} out of 5">${n}</button>`).join('')}</div>
              ${ci === 0 ? '<div class="scale-legend"><span>Weak</span><span>Exceptional</span></div>' : ''}
            </div>`).join('')}
          <div class="note"><label class="field-label" for="note">Private note (optional)</label><textarea id="note" maxlength="1000" placeholder="One line to remind yourself later">${esc(draft.note)}</textarea></div>
          <div class="swipe-bar">
            <button class="swipe no" data-v="no"><b>✕</b>${v.no}</button>
            <button class="skip" id="skip">Later</button>
            <button class="swipe yes" data-v="yes"><b>✓</b>${v.yes}</button>
          </div>
          <div class="keys"><kbd>1</kbd>–<kbd>5</kbd> score the highlighted row · <kbd>←</kbd> ${v.no} · <kbd>→</kbd> ${v.yes} · <kbd>↓</kbd> later</div>
        </aside>
      </div>`;
      paintScores();
      bindCard(s);
    }

    function activeCrit() { return S.criteria.find(c => !draft[c.id])?.id || null; }
    function paintScores() {
      const act = activeCrit();
      document.querySelectorAll('.crit').forEach(row => {
        const val = draft[row.dataset.c];
        row.classList.toggle('active', row.dataset.c === act);
        row.querySelectorAll('[data-n]').forEach(b => {
          const n = Number(b.dataset.n);
          b.classList.toggle('on', n === val); b.classList.toggle('fill', !!val && n < val);
          b.setAttribute('aria-checked', n === val);
        });
      });
      const t = total(draft);
      document.getElementById('total').innerHTML = `${fmt(t)}<small>/ 100</small>`;
      document.querySelectorAll('.swipe').forEach(b => b.classList.toggle('sel', b.dataset.v === draft.verdict));
    }

    let saveTimer, pending = null;
    // Each save captures its own submission id and scores when queued, so it can never land on another card.
    function queueSave(immediate = false) {
      clearTimeout(saveTimer);
      const body = { submissionId: curId, round: round(), ...draft };
      const run = async () => {
        try {
          await api('/api/judge/score', { method: 'PUT', body, headers: judgeH() });
          const item = list().find(x => x.id === body.submissionId);
          if (item) item.score = { ...(item.score || {}), ...body, total: total(body) };
        } catch (err) { toast(err.message, true); throw err; }
      };
      pending = null;
      if (immediate) return run();
      pending = run;
      saveTimer = setTimeout(() => flushSave(), 500);
    }
    function flushSave() {
      clearTimeout(saveTimer);
      const run = pending; pending = null;
      return run ? run().catch(() => {}) : Promise.resolve();
    }

    function bindCard(s) {
      document.querySelectorAll('.crit').forEach(row => row.addEventListener('click', e => {
        const b = e.target.closest('[data-n]'); if (!b) return;
        draft[row.dataset.c] = Number(b.dataset.n); paintScores(); queueSave();
      }));
      document.getElementById('note').addEventListener('input', e => { draft.note = e.target.value; queueSave(); });
      document.querySelectorAll('.swipe').forEach(b => b.onclick = () => commit(b.dataset.v));
      document.getElementById('skip').onclick = () => { if (!busy) advance(1); };
      document.getElementById('more')?.addEventListener('click', e => { document.getElementById('desc').classList.toggle('open'); e.target.textContent = document.getElementById('desc').classList.contains('open') ? 'Show less' : 'Read more'; });
      document.getElementById('clock').onclick = () => clock.timer ? pauseClock() : startClock();
      bindDrag();
    }

    async function commit(verdict) {
      if (total(draft) == null) {
        const card = document.getElementById('card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        document.querySelector('.crit.active')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return toast('Score all four criteria first', true);
      }
      if (busy) return;
      busy = true;
      draft.verdict = verdict; paintScores();
      try { await queueSave(true); } catch { busy = false; return; }
      flyOut(verdict === 'yes' ? 1 : -1, () => advance(1));
    }
    function advance(step) {
      flushSave();
      const l = list();
      idx = Math.max(0, l.findIndex(x => x.id === curId));
      idx = Math.min(l.length, idx + step);
      // Jump to the next unfinished card; wrap around once to catch skipped ones.
      if (idx < l.length && isDone(l[idx])) { const n = l.findIndex((x, i) => i >= idx && !isDone(x)); idx = n >= 0 ? n : l.findIndex(x => !isDone(x)); if (idx < 0) idx = l.length; }
      else if (idx >= l.length) { const n = l.findIndex(x => !isDone(x)); if (n >= 0) idx = n; }
      renderChrome(); renderCard();
      window.scrollTo({ top: document.getElementById('chrome').offsetTop + document.getElementById('chrome').offsetHeight - 120, behavior: 'smooth' });
    }

    function flyOut(dir, done) {
      const card = document.getElementById('card');
      if (!card || matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
      card.querySelector(dir > 0 ? '.stamp.yes' : '.stamp.no').style.opacity = 1;
      card.style.transition = 'transform .42s cubic-bezier(.5,0,.75,0), opacity .42s';
      card.style.transform = `translateX(${dir * 120}vw) rotate(${dir * 18}deg)`;
      card.style.opacity = '0';
      setTimeout(done, 380);
    }

    // Tinder-style drag on the card (the video iframe keeps its own clicks).
    function bindDrag() {
      const card = document.getElementById('card');
      let x0 = 0, y0 = 0, dx = 0, dragging = false, decided = false;
      const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
      card.addEventListener('pointerdown', e => {
        if (e.button !== 0 || e.target.closest('a,button,iframe,textarea,input,.desc')) return;
        dragging = true; decided = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
        card.style.transition = 'none';
      });
      card.addEventListener('pointermove', e => {
        if (!dragging) return;
        dx = e.clientX - x0; const dy = e.clientY - y0;
        if (!decided) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; decided = true; if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return; } card.setPointerCapture(e.pointerId); }
        card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
        yes.style.opacity = Math.max(0, Math.min(1, dx / 120)); no.style.opacity = Math.max(0, Math.min(1, -dx / 120));
      });
      const end = () => {
        if (!dragging) return; dragging = false;
        if (Math.abs(dx) > 120 && total(draft) != null) { commit(dx > 0 ? 'yes' : 'no'); return; }
        card.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)'; card.style.transform = ''; yes.style.opacity = no.style.opacity = 0;
        if (Math.abs(dx) > 120) commit(dx > 0 ? 'yes' : 'no'); // triggers the "score first" shake
      };
      card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    }

    // Demo clock: starts automatically when the judge clicks into the video.
    function tick() {
      const el = document.getElementById('clock'); if (!el) return stopClock();
      const secs = Math.floor((clock.elapsed + (clock.timer ? Date.now() - clock.start : 0)) / 1000);
      el.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} / 1:30`;
      el.classList.toggle('over', secs >= DEMO_LIMIT); el.classList.toggle('run', !!clock.timer);
      if (secs === DEMO_LIMIT && clock.timer) toast('1:30 reached, time to score');
    }
    function startClock() { if (clock.timer) return; clock.start = Date.now(); clock.timer = setInterval(tick, 250); tick(); }
    function pauseClock() { if (!clock.timer) return; clock.elapsed += Date.now() - clock.start; clearInterval(clock.timer); clock.timer = null; tick(); }
    function stopClock() { clearInterval(clock.timer); clock = { start: 0, elapsed: 0, timer: null }; }
    window.addEventListener('blur', () => setTimeout(() => { if (document.activeElement?.id === 'player') startClock(); }, 0));

    function renderAllDone() {
      const el = document.getElementById('view');
      if (view === 'review') {
        el.innerHTML = `<div class="empty"><p class="eyebrow orange">All scored</p><h2>Now pick your<br><em>top 3.</em></h2><p class="lede">One project per track. We've preselected your highest score in each. Check them and confirm.</p><button class="button" id="toPicks">Choose top picks →</button></div>`;
        document.getElementById('toPicks').onclick = () => { view = 'picks'; render(); };
      } else if (view === 'shortlist') {
        el.innerHTML = `<div class="empty"><p class="eyebrow orange">Shortlist scored</p><h2>Thank you.<br><em>That's round 2.</em></h2><p class="lede">The organisers will confirm the top ${S.finalistCount} once every judge has finished. This page moves on by itself.</p><button class="button ghost" id="again">Review my scores</button></div>`;
        document.getElementById('again').onclick = () => { idx = 0; renderChrome(); renderCard(); };
      } else {
        el.innerHTML = `<div class="empty"><p class="eyebrow orange">Finals scored</p><h2>All finalists<br><em>scored.</em></h2><p class="lede">You can still change a score until the organisers announce the results.</p><button class="button ghost" id="again">Review my scores</button></div>`;
        document.getElementById('again').onclick = () => { idx = 0; renderChrome(); renderCard(); };
      }
    }

    // ---------- list ----------
    function renderList() {
      const l = list();
      document.getElementById('view').innerHTML = l.length ? `<table class="listview"><thead><tr><th>#</th><th>Project</th><th class="hide-sm">Track</th><th>Score</th><th>Verdict</th></tr></thead><tbody>
        ${l.map((s, i) => `<tr data-i="${i}"><td class="mono muted">${String(i + 1).padStart(2, '0')}</td><td><b>${esc(s.title)}</b><br><span class="muted small">${esc(s.tagline)}</span></td><td class="hide-sm"><span class="pill">${esc(trackName(s.track))}</span></td><td><b>${fmt(total(s.score))}</b></td><td>${s.score?.verdict === 'yes' ? '<span class="pill green">Contender</span>' : s.score?.verdict === 'no' ? '<span class="pill red">Pass</span>' : '<span class="muted small">To do</span>'}</td></tr>`).join('')}
        </tbody></table>` : `<div class="empty"><h2>No projects <em>yet.</em></h2></div>`;
      document.querySelectorAll('.listview tbody tr').forEach(tr => tr.onclick = () => { idx = Number(tr.dataset.i); view = 'review'; render(); });
    }

    // ---------- top picks ----------
    async function renderPicks() {
      const el = document.getElementById('view');
      // Until the judge clicks, their pick in each track follows their best score (the server does the same).
      const pickOf = {}, auto = {};
      for (const t of S.tracks) {
        const own = S.review.find(s => s.id === S.picks[t.id] && s.track === t.id);
        if (own) { pickOf[t.id] = own.id; continue; }
        const best = S.review.filter(s => s.track === t.id && total(s.score) != null).sort((a, b) => (b.score.verdict === 'yes') - (a.score.verdict === 'yes') || total(b.score) - total(a.score))[0];
        if (best) { pickOf[t.id] = best.id; auto[t.id] = true; }
      }
      const canPick = S.phase === 'submissions' || S.phase === 'review';
      const unscored = S.review.filter(s => !isDone(s)).length;
      const chosen = S.tracks.filter(t => pickOf[t.id]).length;
      const available = S.tracks.filter(t => S.review.some(s => s.track === t.id)).length;
      el.innerHTML = `
        <div class="pick-done"><span><b>${chosen} of ${available}</b> <span class="muted">picks chosen${unscored ? ` · ${unscored} project${unscored > 1 ? 's' : ''} still to score` : ''}</span></span>
        <span class="mono ${chosen >= available && available ? '' : 'muted'}" style="color:${chosen >= available && available ? 'var(--green)' : ''}">${!canPick ? 'Picks are locked' : chosen >= available && available ? '✓ Saved. Nothing else to do' : 'Picks save as you click'}</span></div>
        <div class="picks">${S.tracks.map((t, ti) => {
          const items = S.review.filter(s => s.track === t.id).sort((a, b) => (total(b.score) ?? -1) - (total(a.score) ?? -1));
          return `<div class="pick-col"><p class="eyebrow orange" style="margin:0">0${ti + 1}</p><h3>${esc(t.name)}</h3>
            ${auto[t.id] ? '<p class="muted small" style="margin:-6px 0 10px">Suggested from your best score. It follows your scores until you click one.</p>' : ''}
            ${items.length ? items.map(s => `<button class="pick ${pickOf[t.id] === s.id ? 'sel' : ''}" data-t="${t.id}" data-id="${s.id}" aria-pressed="${pickOf[t.id] === s.id}" ${canPick ? '' : 'disabled'}>
              <span><b>${esc(s.title)}</b><small>${s.score?.verdict === 'yes' ? 'Contender' : s.score?.verdict === 'no' ? 'Passed' : 'Not scored yet'}</small></span>
              <span class="score">${fmt(total(s.score))}<small>${pickOf[t.id] === s.id ? (auto[t.id] ? '☆ Suggested' : '★ Your pick') : ''}</small></span></button>`).join('')
              : '<p class="muted small">No projects in this track were assigned to you.</p>'}
          </div>`;
        }).join('')}</div>`;
      el.querySelectorAll('.pick').forEach(b => b.onclick = async () => {
        const track = b.dataset.t, id = Number(b.dataset.id);
        try {
          await api('/api/judge/pick', { method: 'PUT', body: { track, submissionId: id }, headers: judgeH() });
          S.picks[track] = id; toast('Pick saved'); renderPicks();
        } catch (err) { toast(err.message, true); }
      });
    }

    // ---------- keyboard ----------
    document.addEventListener('keydown', e => {
      if (!document.getElementById('card') || e.target.closest('textarea,input') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (/^[1-5]$/.test(e.key)) {
        const c = activeCrit() || S.criteria[S.criteria.length - 1].id;
        draft[c] = Number(e.key); paintScores(); queueSave(); e.preventDefault();
      } else if (e.key === 'ArrowRight') { commit('yes'); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { commit('no'); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { if (!busy) advance(1); e.preventDefault(); }
      else if (e.key === 'Backspace') { const filled = S.criteria.filter(c => draft[c.id]); if (filled.length) { draft[filled[filled.length - 1].id] = null; paintScores(); queueSave(); } e.preventDefault(); }
    });

    load(true);
  })();
  </script>
</body>
</html>
